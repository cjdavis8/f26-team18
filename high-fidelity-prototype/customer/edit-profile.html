 <header class="site-header">

<!-- LEFT: BUTTONS -->

  <a href="../homepage.html"> <button>Home</button></a>
  <button class="header-button">About</button>
  <button class="header-button">Services</button>
  <button class="header-button">Help</button>
  <a href="provider.html"> <button>Provider</button></a>

</div>
<!-- CENTER: LOGO AND RETURN TO HOMEPAGE -->
<div class="header-center">
  <a href="../homepage.html"><img src="https://i.imgur.com/NFH2TyE.png" alt="PetPal Header Logo" class="logo"></a>
</div>
<!-- RIGHT: Customer Dashboard -->
<div class="header-right">
  <a href="profile.html"><button class="header-button">My Profile</button></a>
  <a href = "../homepage.html"><button class="header-button">Log Out</button></a>
</div>

 </header>
<!-- END OF HEADER -->
<body style="background-color: #cfe8cf">

    <section class="section" style="background: #4c824c; padding:1rem; margin:2rem;">
      <div class="container">
        <h1 style="font-size: 2rem; font-weight: 700;">Edit Personal Information</h1>
        <p class="text-muted">Update your personal details below</p>
      </div>
    </section>

    <section class="section" style="padding: 1rem;">
        <div class="container" style="max-width: 800px; max-height:fit-content;">
        <div class="card" style="padding:1rem">

            <form id="customerForm" style = "margin-left:5rem; margin-right:5rem">
                <!-- Information Change Form -->

                <div class="form-group">
                <label for="firstName">First Name</label><br>
                <input type="text" id="firstName" placeholder="Corina" required="">
                </div>

                <div class="form-group">
                <label for="lastName">Last Name</label><br>
                <input type="text" id="lastName" placeholder="PB" required="">
                </div>

                <div class="form-group">
                <label for="email">Email Address</label><br>
                <input type="email" id="email" placeholder="corina@example.com" required="">
                </div>


                <!-- Submit Button -->
                <button type="button" class="btn btn-success btn-large" onclick="confirmChanges()" style="width: 100%; margin-top: 1.5rem;">
                Confirm Changes
                </button>

            </form>
            </div>
        </div>
        </div>
    </section>
</body>



 <script>
    function confirmChanges() {
      const form = document.getElementById('customerForm');
      if (form.checkValidity()) {
        // Navigate to customer profile
        window.location.href = 'profile.html';
      } else {
        alert('Please fill in all required fields');
      }
    }
  </script>
