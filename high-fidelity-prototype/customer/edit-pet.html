 <header class="site-header">
    <title>PetPal - Register as a customer</title>
<!-- LEFT: BUTTONS -->
<div class="header-left">
  <a href="../homepage.html"> <button>Home</button></a>
  <button class="header-button">About</button>
  <button class="header-button">Services</button>
  <button class="header-button">Help</button>
  <a href="provider.html"> <button>Provider</button></a>

</div>
<!-- CENTER: LOGO AND RETURN TO HOMEPAGE -->
<div class="header-center">
  <a href="../homepage.html"><img src="https://i.imgur.com/NFH2TyE.png" alt="PetPal Header Logo" class="logo"></a>
</div>
<!-- RIGHT: Customer Dashboard -->
<div class="header-right">
  <a href="profile.html"><button class="header-button">My Profile</button></a>
  <a href = "../homepage.html"><button class="header-button">Log Out</button></a>
</div>

 </header>
<!-- END OF HEADER -->
<body style="background-color: #cfe8cf">

    <section class="section" style="background: #4c824c; padding:1rem; margin:2rem;">
      <div class="container">
        <h1 style="font-size: 2rem; font-weight: 700;">Edit Pet Information</h1>
        <p class="text-muted">Update your pet details below</p>
      </div>
    </section>

    <section class="section" style="padding: 1rem;">
        <div class="container" style="max-width: 1000px; max-height:fit-content;">
        <div class="card" style="padding:1rem">
                <!-- Profile Content -->
    <section class="section">
      <div class="container" style="max-width: 800px;">

        <!-- Personal Info Card -->
          
          <div class="card-content" style="margin:2rem">
            <div class="row">
              <div class = "col-sm">
                <div class="pet-portrait">
                <img src="../images/tachanka.jpg" style="width: 300px; height:fit-content; align-self: center;"></img>
                </div>
                <button class="btn btn-light" style="width: 50%; outline-width:2px; outline-color:black; margin-top: 1rem; margin-left:4rem">Edit photo</button>
              </div>
              <div class = "col-sm">
                <div class="card" style="padding:2rem;">
                    <form id="petForm">
                    <div class="form-group">
                        <label for="firstName">Pet's Name</label><br>
                        <input type="text" id="petName" placeholder="Tachanka" required="">
                    </div>
                    <div class="form-group">
                            <!-- Pet Type -->
                        <label for="pType">Pet Type*</label><br>
                        <select id="pType" required="">
                            <option value="">Select a pet type...</option>
                            <option value="dog">Dog</option>
                            <option value="cat">Cat</option>
                        </select>
                    </div>
                        <!-- Pet Breed-->
                    <div class="form-group">
                        <label for="breed">Breed*</label><br>
                        <select id="breed" required="">
                            <option value="">Select a breed...</option>
                            <option value="newfie">Newfoundland</option>
                            <option value="golden">Golden Retriever</option>
                            <option value="short">Domestic Short Hair</option>
                            <option value="long">Domestic Long Hair</option>
                        </select>
                    </div>
                        <!-- Age -->
                    <div class="form-group">
                        <label for="age">Age</label><br>
                        <input type="text" id="petName" placeholder="7" required="">
                    </div>
                    <div class="form-group">
                            <!--Weight-->
                        <label for="weight">Weight</label><br>
                        <input type="text" id="petName" placeholder="150" required="">
                    </div>
                    </form>
                </div>
                </div>
            
            <div class="row">
            <!-- Submit Button -->
                    <button type="button" class="btn btn-success btn-large" onclick="confirmChanges()" style="width: 100%; margin-top: 1rem; text-align: center; padding: 0.75rem 1rem;">
                    Confirm Changes
                    </button>
            <button class="btn btn-danger" onclick="alert('Delete pet - pet will be deleted')" style="width: 100%; margin-top: 1rem; text-align: center; padding: 0.75rem 1rem; color: white; border-color: var(--danger-color);">Delete
              Pet</button>
          </div>
          </div>
        </div>
        </div>

      </div>
    </section>

  </div>
            
            </div>
        </div>
        </div>
    </section>
</body>



 <script>
    function confirmChanges() {
      const form = document.getElementById('petForm');
      if (form.checkValidity()) {
        // Navigate to customer profile
        window.location.href = 'profile.html';
      } else {
        alert('Please fill in all required fields');
      }
    }
  </script>
