<!-- HEADER -->
 <header class="site-header">
    <title>PetPal - Register as a customer</title>
<!-- LEFT: BUTTONS -->
<div class="header-left">
  <a href="../homepage.html"> <button>Home</button></a>
  <button class="header-button">About</button>
  <button class="header-button">Services</button>
  <button class="header-button">Help</button>

</div>
<!-- CENTER: LOGO AND RETURN TO HOMEPAGE -->
<div class="header-center">
  <a href="../homepage.html"><img src="https://i.imgur.com/NFH2TyE.png" alt="PetPal Header Logo" class="logo"></a>
</div>
<!-- RIGHT: LOGIN AND REGISTER -->
<div class="header-right">
  <a href="../login.html"> <button class="header-button">Login</button></a>
  <a href = "#"><button class="header-button">Register</button></a>
</div>

 </header>
<!-- END OF HEADER -->
<body style="background-color: #cfe8cf">
    <section class="section" style="padding: 2rem;">
        <div class="container" style="max-width: 800px; max-height:fit-content;">
        <div class="card">
            <div class="card-content">
            <h2 class="text-center mb-4" style="font-weight: 700; font-size: 1.8rem; margin-top:1rem">Join PetPal</h2>
            <p class="text-center text-muted mb-4">Create your customer profile and find your petcare solution</p>

            <form id="customerForm" style = "margin-left:5rem; margin-right:5rem">
                <!-- Personal Information -->
                <h3 >Personal Information</h3>

                <div class="form-group">
                <label for="firstName">First Name</label><br>
                <input type="text" id="firstName" placeholder="Corina" required="">
                </div>

                <div class="form-group">
                <label for="lastName">Last Name</label><br>
                <input type="text" id="lastName" placeholder="PB" required="">
                </div>

                <div class="form-group">
                <label for="email">Email Address</label><br>
                <input type="email" id="email" placeholder="corina@example.com" required="">
                </div>

                <div class="form-group">
                <label for="password">Password</label><br>
                <input type="password" id="password" placeholder="••••••••" required="">
                </div>

                <!-- Pet Information -->
                <h3>Pet Information</h3>
    
    <div id="container">

                <div class="form-group">
                <label for="firstName">Pet's Name</label><br>
                <input type="text" id="petName" placeholder="Tachanka" required="">
                </div>
                <div class="form-group">
                    <!-- Pet Type -->
                <label for="pType">Pet Type*</label><br>
                <select id="pType" required="">
                    <option value="">Select a pet type...</option>
                    <option value="dog">Dog</option>
                    <option value="cat">Cat</option>
                </select>
                </div>
                    <!-- Pet Breed-->
                <div class="form-group">
                <label for="breed">Breed*</label><br>
                <select id="breed" required="">
                    <option value="">Select a breed...</option>
                    <option value="newfie">Newfoundland</option>
                    <option value="golden">Golden Retriever</option>
                    <option value="short">Domestic Short Hair</option>
                    <option value="long">Domestic Long Hair</option>
                </select>
                </div>
                    <!-- Age -->
                <div class="form-group">
                <label for="age">Age</label><br>
                <input type="text" id="petName" placeholder="7" required="">
                </div>
                <div class="form-group">
                    <!--Weight-->
                <label for="weight">Weight</label><br>
                <input type="text" id="petName" placeholder="150" required="">
                </div>

                <div class = form-group>
                    <label for = newPet>
                    
                        <input type="button" style="margin-top:1rem" value = "Add Another Pet"> </input>
                    </label>
                </div>
                


                <!-- Terms -->
                <div class="form-group" style="margin-top: 1.5rem;">
                <label style="display: flex; align-items: flex-start; margin: 0;">
                    <input type="checkbox" id="terms" required="" style="width: auto; margin-right: 0.5rem; margin-top: 0.25rem;">
                    <span>I agree to the Terms of Service and Privacy Policy</span>
                </label>
                </div>

                <!-- Submit Button -->
                <button type="button" class="btn btn-success btn-large" onclick="registerCustomer()" style="width: 100%; margin-top: 1.5rem;">
                Create Customer Account
                </button>

                <!-- Provider Link -->
                <p class="text-center mt-4">
                Are you a service provider? <a href="provider/register.html" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Sign up as a provider</a>
                </p>

                <!-- Already has account -->
                <p class="text-center">
                Already have an account? <a href="login.html" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Login here</a>
                </p>
            </form>
            </div>
        </div>
        </div>
    </section>
</body>



 <script>
    function registerCustomer() {
      const form = document.getElementById('customerForm');
      if (form.checkValidity()) {
        // Navigate to customer profile
        window.location.href = 'profile.html';
      } else {
        alert('Please fill in all required fields');
      }
    }
  </script>
  <!-- LINK TO CSS -->
<link rel="stylesheet" href="../style.css">

</html>
