<!DOCTYPE html>

<!--- BEGINNING OF HTML FOR HOMEPAGE -->
<html>

<!-- HEADER -->
 <header class="site-header">
<!-- LEFT: BUTTONS -->
<div class="header-left">
  <a href="homepage.html"> <button>Home</button></a>
  <button class="header-button">About</button>
  <button class="header-button">Services</button>
  <button class="header-button">Help</button>
  <a href="provider.html"> <button>Provider</button></a>

</div>
<!-- CENTER: LOGO AND RETURN TO HOMEPAGE -->
<div class="header-center">
  <a href="homepage.html"><img src="https://i.imgur.com/NFH2TyE.png" alt="PetPal Header Logo" class="logo"></a>
</div>
<!-- RIGHT: LOGIN AND REGISTER -->
<div class="header-right">
  <a href = "login.html"><button class="header-button">Login</button></a>
  <a href = "customer/register.html"><button class="header-button">Register</button></a>
</div>

 </header>
<!-- END OF HEADER -->

<body style="background-color: #cfe8cf">
    <section class="section" style="padding: 4rem 2rem; display: flex; align-items: center; justify-content: center; min-height: 80vh;">
        <div class="container" style="max-width: 500px;">
            <div class="card">
            <div class="card-content">
                <h2 class="text-center mb-4" style="font-weight: 700; font-size: 1.8rem;">Welcome back to PetPal</h2>
                <p class="text-center text-muted mb-4">Sign in to your account to manage your pet services</p>

                <form>
                <div class="form-group">
                    <label for="email">Email Address</label><br>
                    <input type="email" id="email" placeholder="corina@example.com" required="">
                </div>

                <div class="form-group">
                    <label for="password">Password</label><br>
                    <input type="password" id="password" placeholder="••••••••" required="">
                </div>

                <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                    <label style="margin: 0;">
                    <input type="checkbox" style="width: auto; margin-right: 0.5rem;">
                    Remember me
                    </label>
                    <a href="#" style="color: var(--primary-color); text-decoration: none;">Forgot password?</a>
                </div>

                <button type="button" class="btn btn-success btn-large" onclick="loginCustomer()" style="width: 100%; margin-top: 1.5rem;">
                    Sign In as Customer
                </button>

                <button type="button" class="btn btn-light btn-large" onclick="loginProvider()" style="width: 100%; margin-top: 1rem;">
                    Sign in as a service provider
                </button>
                </form>

                <p class="text-center mt-4">
                Don't have an account? <a href="customer/register.html" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Sign up here</a>
                </p>
            </div>
            </div>
        </div>
        </section>
</body>
    <!-- SET BACKGROUDN COLOR -->
<style>
    body {
        background-color: #C2E5D3;
        margin: 0;
    }
</style>

<script>
      function loginCustomer() {
        // Navigate to customer dashboard
        window.location.href = 'customer/dashboard.html';
      }

      function loginProvider() {
        // Navigate to provider dashboard
        window.location.href = 'provider/dashboard.html';
      }
</script>

</html>
